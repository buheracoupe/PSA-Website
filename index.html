<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#062f57" />
    <meta name="description" content="Pump Systems Africa — pumping, water and renewable energy solutions across Africa." />
    <script>
      (() => {
        let saved = null;
        try { saved = localStorage.getItem('psa-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#081725' : '#062f57');
      })();
    </script>
    <title>Pump Systems Africa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
